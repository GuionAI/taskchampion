name: Cargo Swift Spike

on:
  workflow_dispatch:
    inputs:
      lib-type:
        description: "Library type to package with cargo-swift."
        required: true
        default: dynamic
        type: choice
        options:
          - dynamic
          - static

permissions:
  contents: read

concurrency:
  group: cargo-swift-spike-${{ github.ref }}-${{ inputs.lib-type }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1 (stable)
        with:
          toolchain: stable

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show tool versions
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-swift-spike-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-swift-spike-registry-

      - name: Cache cargo build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target
            ffi/target
          key: ${{ runner.os }}-cargo-swift-spike-target-${{ inputs.lib-type }}-${{ hashFiles('**/Cargo.lock', 'ffi/Cargo.toml', 'ffi/uniffi.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-swift-spike-target-${{ inputs.lib-type }}-

      - name: Install cargo-swift
        run: |
          set -euo pipefail
          cargo install cargo-swift@0.11.1 --locked
          cargo swift --version

      - name: Package with cargo-swift
        env:
          LIB_TYPE: ${{ inputs.lib-type }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/taskchampion-ffi"

          rm -rf "$workdir"
          mkdir -p "$workdir"
          rsync -a --exclude target ffi/ "$workdir"/

          python3 - "$GITHUB_WORKSPACE" "$workdir/Cargo.toml" "$workdir/uniffi.toml" <<'PY'
          import sys
          from pathlib import Path

          repo = Path(sys.argv[1])
          cargo_toml = Path(sys.argv[2])
          uniffi_toml = Path(sys.argv[3])

          content = cargo_toml.read_text()
          content = content.replace('path = ".."', f'path = "{repo}"')
          content = content.replace('path = "../praxis"', f'path = "{repo / "praxis"}"')
          cargo_toml.write_text(content)

          content = uniffi_toml.read_text()
          content = content.replace(
              'module_name = "TaskChampionFFI"',
              'ffi_module_name = "TaskChampionCore"',
              1,
          )
          uniffi_toml.write_text(content)
          PY

          cd "$workdir"
          cat uniffi.toml

          cargo swift package \
            -p ios@14 macos@14 \
            -n TaskChampionFFI \
            --release \
            --lib-type "${LIB_TYPE}" \
            --bundle-identifier com.guion.taskchampion \
            --swift-tools-version 5.9 \
            -y --silent

          rm -rf "$GITHUB_WORKSPACE/ffi/TaskChampionFFI"
          cp -R TaskChampionFFI "$GITHUB_WORKSPACE/ffi/TaskChampionFFI"

      - name: Inspect cargo-swift output
        working-directory: ffi
        run: |
          set -euo pipefail
          package_dir="TaskChampionFFI"
          xcframework="$(find "$package_dir" -maxdepth 1 -name '*.xcframework' -type d | head -n 1)"

          if [ -z "$xcframework" ]; then
            echo "ERROR: cargo-swift did not create an XCFramework under ${package_dir}" >&2
            find "$package_dir" -maxdepth 4 -print | sort >&2
            exit 1
          fi

          {
            echo "## Package.swift"
            sed -n '1,220p' "$package_dir/Package.swift"
            echo
            echo "## Output tree"
            find "$package_dir" -maxdepth 6 -print | sort
            echo
            echo "## Binary files"
            find "$xcframework" -type f -perm -111 -print | sort
            echo
            echo "## Framework bundles"
            find "$xcframework" -name '*.framework' -type d -print | sort
          } | tee cargo-swift-report.txt

          while IFS= read -r binary; do
            echo "## file ${binary}" | tee -a cargo-swift-report.txt
            file "$binary" | tee -a cargo-swift-report.txt
            if otool -D "$binary" >/tmp/otool-d.out 2>/tmp/otool-d.err; then
              tee -a cargo-swift-report.txt < /tmp/otool-d.out
            fi
          done < <(find "$xcframework" -type f -perm -111 -print | sort)

          zip -r cargo-swift-package.zip "$package_dir"

      - name: Upload cargo-swift spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-swift-${{ inputs.lib-type }}-${{ github.run_id }}
          path: |
            ffi/TaskChampionFFI
            ffi/cargo-swift-report.txt
            ffi/cargo-swift-package.zip
          if-no-files-found: warn
